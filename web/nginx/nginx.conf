# Nginx sem usuário root, com logs sem query string e arquivos temporários graváveis.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format dashboard escape=json '{"method":"$request_method","path":"$uri","status":$status}';
    access_log /dev/stdout dashboard;
    sendfile on;
    server_tokens off;
    include /etc/nginx/conf.d/*.conf;
}
